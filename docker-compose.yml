name: event-driven-ops

services:
  data-generator:
    build: ../data-generator
    container_name: data-generator
    ports:
      - "8080:8080"
    volumes:
      - ../data-generator/internal/config/config.yaml:/app/internal/config/config.yaml
      - ../data-generator/data:/app-data-generator/data
    networks:
      - event-driver-app-net

  data-consumer:
    build: .
    container_name: data-consumer
    env_file:
      - path: ./.env
        required: true
    ports:
      - "${PORT}:8081"
    environment:
      - ENV=${ENV}
      - GENERATOR_BASE_URL=${GENERATOR_BASE_URL}
      - GENERATOR_STREAM_URL=${GENERATOR_STREAM_URL}
      - GENERATOR_BATCH_URL=${GENERATOR_BATCH_URL}
      - DB_URL=${DB_URL}
    volumes:
      - consumer-data:/app-data-consumer/data
    depends_on:
      data-generator:
        condition: service_started
      mongodb:
        condition: service_started
      kafka1:
        condition: service_healthy
    networks:
      - event-driver-app-net

  data-worker:
    build: ../data-worker
    container_name: data-worker
    environment:
      - DB_URL=mongodb://admin:admin@mongodb:27017/?authSource=admin&directConnection=true
      - DB_NAME=event_driver
      - STREAM_COLLECTION=stream_data
      - BATCH_COLLECTION=batch_data
    depends_on:
      mongodb:
        condition: service_started
      kafka1:
        condition: service_healthy
    networks:
      - event-driver-app-net

  mongodb:
    image: mongodb/mongodb-atlas-local
    hostname: mongodb
    container_name: mongodb
    env_file:
      - path: ./.env
        required: true
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGODB_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - db:/data/db
      - configdb:/data/configdb
      - mongot:/data/mongot
    networks:
      event-driver-app-net:
        aliases:
          - mongo

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=admin
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
    networks:
      - event-driver-app-net

  kafka1:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka1:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka1:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./init-kafka.sh:/usr/local/bin/init-kafka.sh
    entrypoint: ["/bin/sh", "/usr/local/bin/init-kafka.sh"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - event-driver-app-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-cluster-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092
    depends_on:
      - kafka1
    networks:
      - event-driver-app-net

networks:
  event-driver-app-net:
    driver: bridge

volumes:
  db-data:
  db:
  configdb:
  mongot:
  kafka-data:
  consumer-data: